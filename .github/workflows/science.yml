name: Science checks

on:
  pull_request:
  push:
    branches: [main, science-validation-v2]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/projected_baseline_table.py
      - run: python tools/validate_model.py
      - run: node tools/validate_browser_contract.js
