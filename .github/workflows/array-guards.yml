name: Array guards

on:
  push:
    branches: [upgrade-v2]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/js/array-synthesis.js
      - run: node tools/validate_arrays.js
